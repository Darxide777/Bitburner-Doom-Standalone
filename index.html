<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOOM - Standalone Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            font-family: monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        #game-container {
            width: 100%;
            max-width: 900px;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    
    <!-- Load the BitBurner adapter first -->
    <script src="bitburner-adapter.js"></script>
    
    <!-- Initialize the game -->
    <script>
        (async () => {
            try {
                // Execute the game using the adapter
                await window.executeDoomJs();
            } catch (error) {
                console.error('Failed to start game:', error);
                document.body.innerHTML = `<div style="color: #f00; text-align: center; padding: 20px;">
                    <h1>Error Loading Game</h1>
                    <p>${error.message}</p>
                    <p>Check the browser console for details.</p>
                </div>`;
            }
        })();
    </script>
</body>
</html>

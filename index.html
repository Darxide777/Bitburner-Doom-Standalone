<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOOM - Standalone Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            font-family: monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        #game-container {
            width: 100%;
            max-width: 900px;
        }
        #status {
            color: #e00;
            text-align: center;
            letter-spacing: 2px;
            font-size: 14px;
        }
        #debug-log {
            display: none;   /* shown only with ?debug in the address */
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.9);
            color: #0f0;
            font-family: monospace;
            font-size: 10px;
            max-width: 300px;
            max-height: 200px;
            overflow-y: auto;
            padding: 10px;
            border: 1px solid #0f0;
            z-index: 99999;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div id="game-container"><div id="status">Loading...</div></div>
    <div id="debug-log"></div>
    
    <!-- Load the BitBurner adapter -->
    <script src="bitburner-adapter.js"></script>
    
    <!-- Start the game once the adapter has loaded. Add ?debug to the address to see a log box, ?base=<url> to load the
         game files from somewhere other than the GitHub repo. -->
    <script>
        const debugLog = document.getElementById('debug-log');
        const params = new URLSearchParams(location.search);
        if (params.has('debug')) debugLog.style.display = 'block';

        function log(msg) {
            console.log(msg);
            debugLog.textContent += msg + '\n';
            debugLog.scrollTop = debugLog.scrollHeight;
        }

        window.addEventListener('load', async () => {
            try {
                if (typeof window.executeDoomJs !== 'function') throw new Error('The game adapter did not load');
                await window.executeDoomJs();
                document.getElementById('status')?.remove();
            } catch (error) {
                log('ERROR: ' + error.message);
                document.body.innerHTML = '<div style="color:#f00;text-align:center;padding:20px;font-family:monospace">' +
                    '<h1>Error Loading Game</h1><p></p><p style="font-size:12px">Check your connection and reload the page.</p></div>';
                document.querySelector('p').textContent = error.message;
            }
        });
    </script>
</body>
</html>
